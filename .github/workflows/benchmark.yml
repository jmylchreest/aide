name: benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'   # nightly ~03:23 UTC
  workflow_dispatch:

# Trusted pushes/schedules/dispatches use ephemeral homelab ARC runners.
# Pull requests stay on GitHub-hosted runners; no fork code runs in the homelab.
jobs:
  bench-smoke:
    name: Benchmark smoke (compile + run 1x)
    runs-on: ${{ github.event_name != 'pull_request' && 'aide-linux' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: aide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: aide/go.mod
          cache-dependency-path: aide/go.sum

      - name: Download dependencies
        run: go mod download

      # Run each benchmark once to catch compilation and setup failures in PRs.
      - name: Benchmark smoke test
        run: make bench-smoke

  bench-measure:
    name: Benchmark measurement
    runs-on: ${{ github.event_name != 'pull_request' && 'aide-linux' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: aide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: aide/go.mod
          cache-dependency-path: aide/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -benchtime=200ms -count=3 \
            ./pkg/store/... ./pkg/survey/... ./pkg/grammar/... ./pkg/code/... ./pkg/memory/... \
            > bench-results.txt 2>&1
          tail -5 bench-results.txt

      # path is relative to GITHUB_WORKSPACE (repo root), not working-directory,
      # so the file written inside aide/ is aide/bench-results.txt here.
      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-benchmarks
          path: aide/bench-results.txt
          retention-days: 14
          if-no-files-found: error
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
