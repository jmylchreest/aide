name: Plugin Scanner

# HOL plugin scanner. Runs on push/PR because the awesome-ai-plugins listing
# requires the scanner to run in this repo's CI. Advisory only: its rule set
# changes outside this repo, so a new heuristic must not fail aide's builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@8db741c699f3554e9c7f4947e8954f9190332e6b # v1.2.801
        with:
          plugin_dir: "."
          # Honor reviewed fixture/template exclusions in .plugin-scanner.toml.
          trust_repository_policy: "true"
          min_score: 80
          fail_on_severity: high
