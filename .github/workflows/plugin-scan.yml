name: Plugin Scanner
run-name: ${{ inputs.fallback_of && format('fallback:{0}', inputs.fallback_of) || github.workflow }}

# HOL plugin scanner. Runs on push/PR because the awesome-ai-plugins listing
# requires the scanner to run in this repo's CI. Advisory only: its rule set
# changes outside this repo, so a new heuristic must not fail aide's builds.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Runner backend
        type: choice
        options: [hosted, arc]
        default: hosted
      source_sha:
        description: Exact source commit supplied by the fallback router
        type: string
      fallback_of:
        description: Parent run ID supplied by the fallback router
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: HOL Plugin Scanner
    if: ${{ !inputs.source_sha || inputs.source_sha == github.workflow_sha }}
    runs-on: ${{ github.event_name != 'pull_request' && inputs.backend == 'arc' && 'aide-linux' || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58 # v1.2.816
        with:
          plugin_dir: "."
          # Honor reviewed fixture/template exclusions in .plugin-scanner.toml.
          trust_repository_policy: "true"
          min_score: 80
          fail_on_severity: high
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
