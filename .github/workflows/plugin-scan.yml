name: Plugin Scanner

# HOL plugin scanner. Runs on push/PR because the awesome-ai-plugins listing
# requires the scanner to run in this repo's CI. Advisory only: its rule set
# changes outside this repo, so a new heuristic must not fail aide's builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@92356daf90a3df7bbdd323222a448a6bb79bc823 # v1.2.601
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
